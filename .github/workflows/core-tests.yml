name: 'Core'

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-app-bun:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout branch'
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: 'Setup Bun'
        # See https://bun.sh/guides/runtime/cicd
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 'Install just'
        # casey/just: https://just.systems/man/en/chapter_6.html
        # taiki-e/install-action: https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@just

      - name: 'Install site dependencies from bun.lockb'
        run: bun install --frozen-lockfile

      - name: 'Build and test the file service from package-lock.json'
        run: just files-test npm

      - name: 'Build (bun)'
        run: |
          just b # build

      - name: 'Typecheck (bun check, astro check)'
        run: |
          just typecheck-nosync # the build already ran astro sync

      - name: 'Test (bun)'
        run: |
          just t # test, including build-output checks

      - name: 'Build the file service'
        run: bun run --bun --cwd services/files build
